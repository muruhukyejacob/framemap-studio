name: Build installers

# Every push to main builds Windows + macOS installers and publishes them as the
# latest GitHub Release (tag v<version from Cargo.toml>). The app's
# "Check for updates" reads that release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: cargo test --release
      - run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ steps.v.outputs.version }} packaging\windows\installer.nsi
          Copy-Item target\release\framemap.exe "dist\FrameMap Studio.exe"
          Compress-Archive -Path "dist\FrameMap Studio.exe", LICENSE -DestinationPath dist\FrameMap-Studio-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FrameMap-Studio-Windows
          path: |
            dist/FrameMap-Studio-Setup.exe
            dist/FrameMap-Studio-Windows-Portable.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: bash packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FrameMap-Studio-macOS
          path: dist/FrameMap-Studio.dmg

  release:
    if: github.event_name == 'push'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FrameMap Studio ${{ steps.v.outputs.version }}
          make_latest: "true"
          body_path: CHANGELOG-latest.md
          files: out/*
