[package]
name = "framemap"
version = "1.0.0"
edition = "2021"
description = "FrameMap Studio - conceptual framework and systems map builder"
authors = ["Muruhukye Jacob"]
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tiny-skia = "0.11"
ab_glyph = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
